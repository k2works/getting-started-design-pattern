# HLint configuration for design-pattern project
# Suppress suggestions that conflict with pedagogical intent

# Explicit lambdas are clearer for pattern teaching
- ignore: {name: "Avoid lambda using `infix`"}

# Explicit lambdas with const are more readable for learners
- ignore: {name: "Use const"}

# newtype vs data: Command has 3 fields, but FileState is kept as data for clarity
- ignore: {name: "Use newtype instead of data", within: Command}

# Record patterns: explicit field access is clearer in teaching code
- ignore: {name: "Use record patterns"}

# fromMaybe: explicit case is clearer for learning
- ignore: {name: "Replace case with fromMaybe"}
