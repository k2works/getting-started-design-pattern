AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Metrics/MethodLength:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 7
  Exclude:
    - '16-interpreter/lib/interpreter.rb'

Metrics/PerceivedComplexity:
  Max: 7

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - '**/test/**/*'
    - 'Rakefile'

Naming/MethodName:
  Enabled: false

Naming/AsciiIdentifiers:
  Exclude:
    - 'test/**/*'
    - '**/test/**/*'

# 一次資料（Russ Olsen 本）の API に忠実な命名を許可
Naming/AccessorMethodName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

# パターン実装では関連クラスを 1 ファイルにまとめる
Style/OneClassPerFile:
  Enabled: false

Layout/LineLength:
  Max: 200

# パターン実装ではサブクラスが意図的に super を省略するケースがある
Lint/MissingSuper:
  Enabled: false

# Singleton パターンの教材としてクラス変数の使用を許可
Style/ClassVars:
  Enabled: false

# Builder パターンの一次資料に忠実な boolean パラメータを許可
Style/OptionalBooleanParameter:
  Enabled: false

# Interpreter の Parser は構造上複雑になるため緩和
Metrics/AbcSize:
  Max: 25
  Exclude:
    - '**/test/**/*'

# Builder のテストは手順が多いため許可
Metrics/MethodLength:
  Exclude:
    - '**/test/**/*'
    - '16-interpreter/lib/interpreter.rb'

# Interpreter の Parser の重複メソッド定義を許可（getter と validation）
Lint/DuplicateMethods:
  Exclude:
    - '15-builder/lib/builder.rb'
