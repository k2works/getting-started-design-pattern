site_name: デザインパターンからはじめるプログラミング入門
site_description: デザインパターンを題材に、よいソフトウェア（変更を楽に安全にできて役に立つソフトウェア）を作るための規律と実践を学ぶプロジェクトのドキュメントサイトです。
site_author: k2works
repo_url: https://github.com/k2works/getting-started-design-pattern
repo_name: getting-started-design-pattern

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works/getting-started-design-pattern
      name: GitHub Repository/getting-started-design-pattern

plugins:
  - search

exclude_docs: |
  wiki

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
  - 要件:
      - 概要: requirements/index.md
  - 設計:
      - 概要: design/index.md
  - 開発:
      - 概要: development/index.md
      - リリース計画: development/release_plan.md
      - イテレーション計画:
          - IT1 Ruby: development/iteration_plan-1.md
          - IT2 Java: development/iteration_plan-2.md
          - IT3 Python: development/iteration_plan-3.md
      - ふりかえり:
          - IT1 Ruby: development/retrospective-1.md
          - IT2 Java: development/retrospective-2.md
      - 完了報告書:
          - IT1 Ruby: development/iteration_report-1.md
          - IT2 Java: development/iteration_report-2.md
  - 運用:
      - 概要: operation/index.md
  - レビュー:
      - 概要: review/index.md
  - ADR:
      - 概要: adr/index.md
  - 記事:
      - 概要: article/index.md
      - デザインパターンからはじめるプログラミング入門:
          - 概要: article/index.md
          - 執筆計画アウトライン: article/outline.md
          - 執筆ワークフロー: article/workflow.md
          - Ruby:
              - 概要: article/ruby/index.md
              - 第 1 章 デザインパターンとパターン思考: article/ruby/01-introduction-to-patterns.md
              - 第 2 章 パターンを支える基本原則: article/ruby/02-principles-and-patterns.md
              - 第 3 章 開発環境と TDD 基盤: article/ruby/03-tdd-and-tooling.md
              - 第 4 章 Template Method: article/ruby/04-template-method.md
              - 第 5 章 Strategy: article/ruby/05-strategy.md
              - 第 6 章 Observer: article/ruby/06-observer.md
              - 第 7 章 Composite: article/ruby/07-composite.md
              - 第 8 章 Iterator: article/ruby/08-iterator.md
              - 第 9 章 Command: article/ruby/09-command.md
              - 第 10 章 Adapter: article/ruby/10-adapter.md
              - 第 11 章 Proxy: article/ruby/11-proxy.md
              - 第 12 章 Decorator: article/ruby/12-decorator.md
              - 第 13 章 Singleton: article/ruby/13-singleton.md
              - 第 14 章 Factory: article/ruby/14-factory.md
              - 第 15 章 Builder: article/ruby/15-builder.md
              - 第 16 章 Interpreter: article/ruby/16-interpreter.md
          - Java:
