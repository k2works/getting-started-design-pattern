name: CI C#

on:
  push:
    branches: [main, develop]
    paths: ['apps/csharp/design-pattern/**', '.github/workflows/ci-csharp.yml']
  pull_request:
    branches: [main]
    paths: ['apps/csharp/design-pattern/**', '.github/workflows/ci-csharp.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/csharp/design-pattern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test --verbosity normal
