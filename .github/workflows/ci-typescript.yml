name: CI TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/typescript/design-pattern/**'
      - '.github/workflows/ci-typescript.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/typescript/design-pattern/**'
      - '.github/workflows/ci-typescript.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/typescript/design-pattern

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/typescript/design-pattern/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-coverage-report
          path: apps/typescript/design-pattern/coverage/
