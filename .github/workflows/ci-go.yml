name: CI Go

on:
  push:
    branches: [main, develop]
    paths: ['apps/go/design-pattern/**', '.github/workflows/ci-go.yml']
  pull_request:
    branches: [main]
    paths: ['apps/go/design-pattern/**', '.github/workflows/ci-go.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go/design-pattern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./... -v
