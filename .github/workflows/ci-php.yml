name: CI PHP

on:
  push:
    branches: [main, develop]
    paths: ['apps/php/design-pattern/**', '.github/workflows/ci-php.yml']
  pull_request:
    branches: [main]
    paths: ['apps/php/design-pattern/**', '.github/workflows/ci-php.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/php/design-pattern
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction
      - run: ./vendor/bin/phpunit
